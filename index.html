<!DOCTYPE html>
<html>
<head>
  <title>Eclipse Clock!!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="space">

    <div class="star star1"></div>
    <div class="star star2"></div>
    <div class="star star3"></div>
    <div class="star star4"></div>
    <div class="star star5"></div>
    <div class="star star6"></div>

    <div class="clock">

      <div class="sun"></div>

      <div class="hour">
        <div class="moon"></div>
      </div>

      <div class="marks">
        <div class="mark m1"></div>
        <div class="mark m2"></div>
        <div class="mark m3"></div>
        <div class="mark m4"></div>
        <div class="mark m5"></div>
        <div class="mark m6"></div>
        <div class="mark m7"></div>
        <div class="mark m8"></div>
        <div class="mark m9"></div>
        <div class="mark m10"></div>
        <div class="mark m11"></div>
        <div class="mark m12"></div>
      </div>

      <div class="hand">
        <div class="point"></div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
